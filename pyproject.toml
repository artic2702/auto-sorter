[project]
name = "autosorter"
version = "0.1.0"
description = "Privacy-first, fully offline photo organizer for Windows — groups photos by person automatically."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.0",
    "pillow-heif>=0.15",
    "rawpy>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Gate: syntax errors, undefined names, invalid comparisons, redefinitions.
select = ["E9", "F63", "F7", "F82", "F811"]
